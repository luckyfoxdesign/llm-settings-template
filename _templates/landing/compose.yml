services:
  # Development
  astro-dev:
    build:
      context: .
      dockerfile: docker-files/Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules

  # Local static preview; production deploys to Vercel
  astro-preview:
    build:
      context: .
      dockerfile: docker-files/Dockerfile.prod
    ports:
      - "127.0.0.1:8080:3000"
